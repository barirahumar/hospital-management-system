<html>
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - MediCare Hospital</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

    <script>

        // If already logged in, go directly to dashboard
        if (localStorage.getItem("isLoggedIn") === "true") {

            window.location.href = "index.html";

        }

    </script>

</head>


<body>


    <div class="login-page">


        <div class="login-card">


            <!-- LOGO -->

            <div class="login-logo">
                🏥
            </div>


            <h2>MediCare Hospital</h2>


            <p class="login-subtitle">
                Hospital Management System
            </p>



            <!-- LOGIN FORM -->

            <form id="loginForm">


                <!-- ================= ROLE ================= -->

                <div class="mb-3">

                    <label class="form-label">
                        Login As
                    </label>

                    <select
                        id="loginRole"
                        class="form-select"
                        required>

                        <option value="">
                            Select Role
                        </option>

                        <option value="admin">
                            👑 Admin
                        </option>

                        <option value="doctor">
                            👨‍⚕️ Doctor
                        </option>

                        <option value="nurse">
                            👩‍⚕️ Nurse
                        </option>

                        <option value="patient">
                            🧑 Patient
                        </option>

                    </select>

                </div>



                <!-- ================= EMAIL ================= -->

                <div class="mb-3">

                    <label class="form-label">
                        Email
                    </label>

                    <input
                        type="email"
                        id="loginEmail"
                        class="form-control"
                        placeholder="Enter email"
                        required>

                </div>



                <!-- ================= PASSWORD ================= -->

                <div class="mb-3">

                    <label class="form-label">
                        Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="loginPassword"
                            class="form-control"
                            placeholder="Enter password"
                            required>

                        <span
                            class="password-toggle"
                            id="toggleLoginPassword">

                            👁️

                        </span>

                    </div>

                </div>



                <!-- ================= LOGIN BUTTON ================= -->

                <button
                    type="submit"
                    class="btn btn-primary w-100">

                    🔐 Login

                </button>



                <!-- ================= CHANGE CREDENTIALS ================= -->

                <button
                    type="button"
                    class="btn btn-outline-secondary w-100 mt-2"
                    id="changeCredentialsBtn">

                    ⚙️ Change Login Details

                </button>


            </form>



            <!-- ================================================= -->
            <!-- CHANGE LOGIN DETAILS -->
            <!-- ================================================= -->

            <div
                id="changeCredentialsBox"
                style="display: none;">


                <hr>


                <h5 class="text-center mb-3">

                    Change Login Details

                </h5>



                <!-- NEW EMAIL -->

                <div class="mb-3">

                    <label class="form-label">

                        New Email

                    </label>

                    <input
                        type="email"
                        id="newEmail"
                        class="form-control"
                        placeholder="Enter new email">

                </div>



                <!-- NEW PASSWORD -->

                <div class="mb-3">

                    <label class="form-label">

                        New Password

                    </label>


                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="newPassword"
                            class="form-control"
                            placeholder="Enter new password">


                        <span
                            class="password-toggle"
                            id="toggleNewPassword">

                            👁️

                        </span>

                    </div>

                </div>



                <!-- SAVE BUTTON -->

                <button
                    type="button"
                    class="btn btn-success w-100"
                    id="saveCredentialsBtn">

                    💾 Save New Login Details

                </button>


            </div>



            <!-- DEMO -->

            <p class="login-demo">

                Admin Demo:
                admin@medicare.com / 123456

                <br>

                Doctor Demo:
                doctor@medicare.com / doctor123

                <br>

                Nurse Demo:
                nurse@medicare.com / nurse123

                <br>

                Patient Demo:
                patient@medicare.com / patient123

            </p>


        </div>

    </div>



    <!-- LOGIN JS -->

    <script src="js/login.js"></script>


</body>

</html>
```
